<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conversion Progress</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 720px; 
      margin: 3rem auto; 
      padding: 0 1rem; 
    }
    .card { 
      border: 1px solid #ddd; 
      padding: 1.5rem; 
      border-radius: 6px; 
    }
    .progress-container {
      width: 100%;
      background-color: #f0f0f0;
      border-radius: 4px;
      margin: 20px 0;
      overflow: hidden;
    }
    .progress-bar {
      height: 30px;
      background-color: #4CAF50;
      width: 0%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .status-text {
      margin: 10px 0;
      font-size: 16px;
    }
    .hidden {
      display: none;
    }
    .success-message {
      color: green;
      font-weight: bold;
      margin-top: 20px;
    }
    .error-message {
      color: red;
      font-weight: bold;
      margin-top: 20px;
    }
    .action-buttons {
      margin-top: 20px;
    }
    .action-buttons a {
      display: inline-block;
      margin-right: 10px;
      padding: 10px 15px;
      background-color: #007cba;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
    .action-buttons a:hover {
      background-color: #005a87;
    }
  </style>
</head>
<body>
  <h1>Converting Your Document</h1>
  <div class="card">
    <p>File: <strong>{{ input_name or "Processing..." }}</strong></p>
    
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
    
    <div class="status-text" id="statusText">Initializing...</div>
    
    <div id="successSection" class="hidden">
      <div class="success-message">Conversion completed successfully!</div>
      <div class="action-buttons">
        <a href="/preview/{{ upload_id }}" target="_blank">Open Preview (new tab)</a>
        <a href="/download/{{ upload_id }}">Download HTML</a>
      </div>
    </div>
    
    <div id="errorSection" class="hidden">
      <div class="error-message" id="errorMessage"></div>
    </div>
  </div>

  <script>
    const uploadId = "{{ upload_id }}";
    let isComplete = false;

    function updateProgress() {
      if (isComplete) return;
      
      fetch(`/api/progress/${uploadId}`)
        .then(response => response.json())
        .then(data => {
          console.log('Progress data received:', data); // Log the received data
          const progressBar = document.getElementById('progressBar');
          const statusText = document.getElementById('statusText');
          
          progressBar.style.width = data.progress + '%';
          progressBar.textContent = data.progress + '%';
          statusText.textContent = data.status;
          
          // Handle completion or error
          if (data.progress === 100 && data.status === 'Complete') {
            console.log('Conversion completed, redirecting to result page'); // Log completion
            // Immediately redirect to the result page
            window.location.href = `/result/${uploadId}`;
            isComplete = true; // Stop further polling
          } else if (data.error) {
            console.log('Error detected, showing error section'); // Log error
            document.getElementById('errorSection').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = 'Error: ' + data.error;
            isComplete = true;
          } else {
            console.log(`Progress: ${data.progress}%, Status: ${data.status}`); // Log ongoing progress
          }
        })
        .catch(error => {
          console.error('Error fetching progress:', error);
          document.getElementById('errorSection').classList.remove('hidden');
          document.getElementById('errorMessage').textContent = 'Connection error occurred';
          isComplete = true;
        });
    }

    // Update progress every 1 second
    setInterval(updateProgress, 1000);
    
    // Initial update
    updateProgress();
  </script>
</body>
</html>
